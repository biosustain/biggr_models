# The nginx access log is now a real file rather than /dev/stdout, so it
# must be rotated. At the observed ~700 req/min it grows roughly 300MB/day.
/var/log/nginx/access.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx nginx
    sharedscripts
    postrotate
        # USR1 makes nginx reopen its log files without dropping connections.
        /usr/bin/docker kill --signal=USR1 biggr-nginx-prod 2>/dev/null || true
    endscript
}
