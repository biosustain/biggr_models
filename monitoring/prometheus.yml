# Scrape config for the BiGGr monitoring stack.
# Retention and storage are set on the prometheus container command line.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host CPU / memory / disk / network.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # nginx connection counters via stub_status.
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Per-request latency and status codes, parsed out of the nginx access log.
  - job_name: nginx_log
    static_configs:
      - targets: ["nginx-log-exporter:4040"]

  # Postgres connections, transactions, cache hit rate, slow queries.
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # External probe of the public endpoint: TLS expiry + reachability.
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://bigg.bio/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
