modules:
  # Probes the public HTTPS endpoint end-to-end, which is what actually
  # exposes TLS expiry and true external reachability.
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200]
      method: GET
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
