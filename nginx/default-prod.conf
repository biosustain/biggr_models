upstream biggr {
        server biggr-web:8910;
}

# Timing-aware access log. The default "combined" format records no
# latency at all, which makes it impossible to tell a slow response from
# an outage after the fact.
#   rt  = total request time (what the client experiences)
#   uct = time to connect to upstream
#   uht = time until upstream sent response headers
#   urt = time until upstream finished the response body
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time uct=$upstream_connect_time '
                 'uht=$upstream_header_time urt=$upstream_response_time';

# nginx's own connection counters, scraped by nginx-prometheus-exporter.
# Bound to the internal network only - never exposed via 80/443.
server {
        listen 8080;
        server_name _;
        access_log off;

        location /stub_status {
                stub_status;
                allow 172.16.0.0/12;
                allow 127.0.0.1;
                deny all;
        }
}


server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name bigg.bio www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location / {
                return 301 https://$host$request_uri;
        }
}


server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name www.bigg.bio biggr.org www.biggr.org;
        server_tokens off;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        return 301 https://bigg.bio$request_uri;
}


server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name bigg.bio;
        server_tokens off;

        access_log /var/log/nginx/access.log timed;

        ssl_certificate /etc/nginx/ssl/live/biggr.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/biggr.org/privkey.pem;

        location / {
                proxy_pass http://biggr;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}
